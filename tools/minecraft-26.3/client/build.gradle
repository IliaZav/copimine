import groovy.json.JsonOutput
import groovy.json.JsonSlurper

plugins {
    id 'net.fabricmc.fabric-loom' version '1.19.1'
}

def profile = new JsonSlurper().parse(file('../profile.lock.json'))
def checkout = file('../../..').canonicalFile
version = '0.1.4+26.3'
group = 'me.copimine'
base { archivesName = 'CopiMineClient' }
layout.buildDirectory = new File(checkout, 'build/minecraft-26.3/client')

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${profile.minecraftVersion}"
    implementation "net.fabricmc:fabric-loader:${profile.fabric.loader}"
    implementation "net.fabricmc.fabric-api:fabric-api:${profile.fabric.api}"
    include "net.fabricmc.fabric-api:fabric-api:${profile.fabric.api}"
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

sourceSets {
    main {
        java.srcDir('../protocol/src/main/java')
        resources.srcDir(new File(checkout, 'CopiMineClient/src/main/resources'))
    }
}

processResources {
    // These encounter projectiles must work with the required client alone.
    // Copy authored models and every referenced atlas from the pack source;
    // do not maintain a second, eventually divergent copy of their geometry.
    from(new File(checkout, 'resourcepacks/src')) {
        include 'assets/copimine/items/end_rift_rift_bolt.json'
        include 'assets/copimine/items/end_rift_web_shot.json'
        include 'assets/copimine/items/end_rift_triple_arrow.json'
        include 'assets/copimine/items/end_rift_arrow_rain.json'
        include 'assets/copimine/items/end_rift_explosive_arrow.json'
        include 'assets/copimine/items/end_rift_void_burst.json'
        include 'assets/copimine/items/end_rift_dragon_breath.json'
        include 'assets/copimine/models/item/end_rift_rift_bolt.json'
        include 'assets/copimine/models/item/end_rift_web_shot.json'
        include 'assets/copimine/models/item/end_rift_triple_arrow.json'
        include 'assets/copimine/models/item/end_rift_arrow_rain.json'
        include 'assets/copimine/models/item/end_rift_explosive_arrow.json'
        include 'assets/copimine/models/item/end_rift_void_burst.json'
        include 'assets/copimine/models/item/end_rift_dragon_breath.json'
        include 'assets/copimine/textures/item/end_event_rift_structure_energy.png'
        include 'assets/copimine/textures/item/end_event_rift_structure_stone.png'
        include 'assets/copimine/textures/item/end_rift_rift_bolt.png'
        include 'assets/copimine/textures/item/end_rift_web_shot.png'
        include 'assets/copimine/textures/item/end_rift_triple_arrow.png'
        include 'assets/copimine/textures/item/end_rift_arrow_rain.png'
        include 'assets/copimine/textures/item/end_rift_explosive_arrow.png'
        include 'assets/copimine/textures/item/end_rift_void_burst.png'
        include 'assets/copimine/textures/item/end_rift_dragon_breath.png'
    }
    inputs.property('version', project.version)
    inputs.property('minecraftVersion', profile.minecraftVersion)
    filesMatching('fabric.mod.json') { expand(version: project.version) }
    doLast {
        def metadata = new File(destinationDir, 'fabric.mod.json')
        def parsed = new JsonSlurper().parse(metadata)
        parsed.description = 'Required CopiMine client features and visuals; additional client mods are optional.'
        parsed.depends.minecraft = profile.minecraftVersion
        parsed.depends.fabricloader = ">=${profile.fabric.loader}"
        parsed.depends['fabric-api'] = ">=${profile.fabric.api}"
        parsed.mixins = ['copimineclient-26.3.mixins.json']
        metadata.setText(JsonOutput.prettyPrint(JsonOutput.toJson(parsed)) + '\n', 'UTF-8')
    }
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xmaxerrs', '1500']
}
// A digest pin is only meaningful if the archive is a pure function of the
// sources: pinned entry order and pinned timestamps are what make an
// unchanged tree produce an unchanged jar on every machine.
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
tasks.withType(JavaCompile).configureEach {
    // The digest pin must describe the SOURCE, so the compiler output is pinned
    // explicitly: source file and line numbers, never the local variable table.
    // Left at javac's default, what lands in the class file depends on whether
    // a Gradle metadata file happened to be cached on the machine doing the
    // build, and no single pin can match both a cold runner and a warm tree.
    options.debugOptions.debugLevel = 'lines,source'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    maxParallelForks = 1
    maxHeapSize = '256m'
    // Keep the heap out of the low 4 GiB so native allocations are not blocked.
    jvmArgs '-XX:HeapBaseMinAddress=4g'
}
