name: CopiMineEndEvent
version: '0.1.0'
main: me.copimine.endevent.CopiMineEndEvent
api-version: '1.21'
author: CopiMine
load: POSTWORLD
depend:
  - CopiMineWorldCore
  - CopiMineArtifacts
commands:
  cmend:
    description: Управление End Rift Event
    usage: /cmend <status|debug|recovery|core|arena|gate|portalroom|resources|ritual|wave|boss|client|test|cleanup|reset|unlock>; /cmend arena border <seconds>; /cmend gate pos1|pos2|open [ticks-per-layer]; /cmend test run creative
permissions:
  copimine.endevent.admin:
    description: Управление End Rift Event
    default: op
  copimine.endevent.test:
    description: Локальные тестовые волны и boss End Rift Event
    default: op
