# CopiMine End Rift Event.  This file is intentionally local/staging-safe by
# default.  The event never changes a world or database outside the server on
# which this plugin is explicitly installed.
environment: local

persistence:
  file: event-state.yml
  backup-file: event-state.yml.bak
  schema-version: 4

resources:
  DIAMOND: 100
  ENDER_EYE: 64
  AMETHYST_SHARD: 128
  BLAZE_ROD: 64

ritual:
  start-ritual-timeout-seconds: 60
  intermission-seconds: 20
  min-players: 2
  max-players: 20
  pad-radii: [5.0, 6.0, 7.0, 8.0]
  pad-occupancy-radius: 1.35
  # Progress stays through a short boundary grace window, then drains at this
  # fraction of real time instead of snapping to zero when a player steps out.
  portal-capture-decay-rate: 0.5

arena:
  world: CopiMine
  radius: 20.0
  vertical-radius: 3.0
  boss-radius: 20.0
  containment-radius: 20.0

mobs:
  spider:
    health-bonus: 14.0
    attack-damage-bonus: 3.0
  skeleton:
    health-bonus: 8.0
    attack-damage-bonus: 2.0
    elite-health: 40.0
    elite-attack-damage-bonus: 2.0

mini-bosses:
  spell-cooldown-seconds: [8, 12]
  spell-telegraph-ticks: 20
  rift-step:
    damage: 5.0
  void-snare:
    damage: 4.0
  echo-pulse:
    damage: 5.0

music:
  volume: 0.85
  # Short, tense instrumental bed while players are still taking their rune
  # positions.  It is selected only while the event is waiting for players.
  ritual-wait:
    sound: copimine:end_rift/ritual_wait
    loop-seconds: 22
  # Each event beat has its own instrumental arrangement.
  phase:
    wave-1:
      sound: copimine:end_rift/wave_1
      loop-seconds: 48
    wave-2:
      sound: copimine:end_rift/wave_2
      loop-seconds: 46
    wave-3:
      sound: copimine:end_rift/wave_3
      loop-seconds: 44
    wave-4:
      sound: copimine:end_rift/wave_4
      loop-seconds: 50
    wave-5:
      sound: copimine:end_rift/wave_5
      loop-seconds: 54
    wave-6:
      sound: copimine:end_rift/wave_6
      loop-seconds: 54
    wave-7:
      sound: copimine:end_rift/wave_7
      loop-seconds: 58
    intermission-1:
      sound: copimine:end_rift/intermission_1
      loop-seconds: 14
    intermission-2:
      sound: copimine:end_rift/intermission_2
      loop-seconds: 14
    intermission-3:
      sound: copimine:end_rift/intermission_3
      loop-seconds: 16
    intermission-5:
      sound: copimine:end_rift/intermission_5
      loop-seconds: 18
    intermission-6:
      sound: copimine:end_rift/intermission_6
      loop-seconds: 18
    core-restoration:
      sound: copimine:end_rift/core_restoration
      loop-seconds: 16
    pre-boss-cooldown:
      sound: copimine:end_rift/pre_boss_cooldown
      loop-seconds: 20
    boss-cinematic:
      sound: copimine:end_rift/boss_cinematic
      loop-seconds: 22
    boss-awakening:
      sound: copimine:end_rift/boss_awakening
      loop-seconds: 45
    boss-hunt:
      sound: copimine:end_rift/boss_hunt
      loop-seconds: 45
    boss-rift:
      sound: copimine:end_rift/boss_rift
      loop-seconds: 45
    boss-overload:
      sound: copimine:end_rift/boss_overload
      loop-seconds: 45
    boss-rage:
      sound: copimine:end_rift/boss_rage
      loop-seconds: 45
    boss-last-seal:
      sound: copimine:end_rift/boss_last_seal
      loop-seconds: 45
    boss-finish:
      sound: copimine:end_rift/boss_finish
      loop-seconds: 20
    victory:
      sound: copimine:end_rift/victory
      loop-seconds: 20

waves:
  hard-cap: 56
  wave-1:
    type: RIFT_CARRIERS
    endermen: 7
    spiders: 10
    skeletons: 5
    elite-endermen: 0
    elite-skeletons: 0
  wave-2:
    type: RIFT_HUNT
    endermen: 9
    spiders: 8
    skeletons: 4
    elite-endermen: 0
    elite-skeletons: 0
  wave-3:
    type: RIFT_GATES
    endermen: 12
    spiders: 1
    skeletons: 5
    elite-endermen: 4
    elite-skeletons: 1
  wave-4:
    type: OBELISK_ASSAULT
    endermen: 1
    spiders: 2
    skeletons: 0
    elite-endermen: 0
    elite-skeletons: 0
  wave-5:
    type: BLACK_FOG
    endermen: 14
    spiders: 10
    skeletons: 6
    elite-endermen: 6
    elite-skeletons: 2
  wave-6:
    type: COLLAPSE_RINGS
    endermen: 14
    spiders: 10
    skeletons: 6
    elite-endermen: 6
    elite-skeletons: 2
  wave-7:
    type: REALITY_SPLIT
    endermen: 0
    spiders: 10
    skeletons: 3
    elite-endermen: 6
    elite-skeletons: 2

# Event-owned mobs use these bounded drops.  Recovery/cleanup removes entities
# directly and therefore never enters EntityDeathEvent or creates kill loot.
event-loot:
  wave-mob:
    ENDER_PEARL: 2
    AMETHYST_SHARD: 1
  elite:
    ENDER_PEARL: 4
    AMETHYST_SHARD: 2
    EXPERIENCE_BOTTLE: 2
  wave-7:
    ENDER_PEARL: 4
    BONE: 4
    AMETHYST_SHARD: 2
  test:
    ENDER_PEARL: 1

# Guaranteed event loot appears at the Core after each initial wave.  The
# marker is persisted before the Item entities are created, so a restart
# cannot duplicate a wave reward.
wave-rewards:
  wave-1:
    ENDER_PEARL: 12
    EXPERIENCE_BOTTLE: 12
    COOKED_BEEF: 24
    ARROW: 12
    IRON_INGOT: 8
  wave-2:
    ENDER_PEARL: 18
    EXPERIENCE_BOTTLE: 18
    GOLD_INGOT: 12
    GOLDEN_CARROT: 18
    GOLDEN_APPLE: 2
  wave-3:
    ENDER_PEARL: 18
    EXPERIENCE_BOTTLE: 24
    DIAMOND: 4
    AMETHYST_SHARD: 12
    ECHO_SHARD: 3
  wave-4:
    ENDER_PEARL: 24
    EXPERIENCE_BOTTLE: 32
    DIAMOND: 5
    GOLDEN_APPLE: 3
    ECHO_SHARD: 3
  wave-5:
    ENDER_PEARL: 36
    EXPERIENCE_BOTTLE: 48
    DIAMOND: 8
    GOLDEN_APPLE: 4
    ECHO_SHARD: 6
    AMETHYST_SHARD: 24
  wave-6:
    ENDER_PEARL: 48
    EXPERIENCE_BOTTLE: 64
    DIAMOND: 12
    GOLDEN_APPLE: 6
    ECHO_SHARD: 8
    AMETHYST_SHARD: 32
  wave-7:
    ENDER_PEARL: 64
    EXPERIENCE_BOTTLE: 80
    DIAMOND: 16
    GOLDEN_APPLE: 8
    ECHO_SHARD: 12
    AMETHYST_SHARD: 40

wave-reward-shared-rare:
  wave-1: 0.0
  wave-2: 0.0
  wave-3: 0.0
  wave-4: 0.35
  wave-5: 0.50
  wave-6: 0.60
  wave-7: 0.75

# One deterministic additive roll set per event-owned mob death. The current
# event-loot values above remain as the local fallback if a profile is omitted.
event-loot-rolls:
  spider:
    ENDER_PEARL: {chance: 0.15, min: 1, max: 1}
    EXPERIENCE_BOTTLE: {chance: 0.08, min: 1, max: 1}
    AMETHYST_SHARD: {chance: 0.10, min: 1, max: 3}
  skeleton:
    ARROW: {chance: 0.18, min: 1, max: 3}
    BONE: {chance: 0.22, min: 1, max: 2}
    EXPERIENCE_BOTTLE: {chance: 0.08, min: 1, max: 2}
  common-enderman:
    DIAMOND: {chance: 0.03, min: 1, max: 1}
    GOLDEN_APPLE: {chance: 0.04, min: 1, max: 1}
    ECHO_SHARD: {chance: 0.02, min: 1, max: 1}
    EXPERIENCE_BOTTLE: {chance: 0.12, min: 1, max: 3}
    ENDER_EYE: {chance: 0.08, min: 1, max: 1}
  elite-enderman:
    DIAMOND: {chance: 0.12, min: 1, max: 2}
    GOLDEN_APPLE: {chance: 0.10, min: 1, max: 1}
    ECHO_SHARD: {chance: 0.08, min: 1, max: 1}
    NETHERITE_SCRAP: {chance: 0.02, min: 1, max: 1}
    EXPERIENCE_BOTTLE: {chance: 0.25, min: 2, max: 5}
  elite-skeleton:
    ARROW: {chance: 0.45, min: 2, max: 6}
    BONE: {chance: 0.40, min: 2, max: 4}
    DIAMOND: {chance: 0.12, min: 1, max: 2}
    ECHO_SHARD: {chance: 0.08, min: 1, max: 1}
  wave-7:
    ENDER_PEARL: {chance: 0.25, min: 1, max: 2}
    AMETHYST_SHARD: {chance: 0.15, min: 1, max: 3}
  test:
    ENDER_PEARL: {chance: 1.0, min: 1, max: 1}

boss:
  # Base value for the two-player event. The current flow freezes the real entity
  # max health from BossHealthPolicy before the boss is spawned:
  # 2=5000, 3=6000, 4=7000, 5=8500, 6=9500, 7=10500, 8=11500,
  # 9=12500, 10=13500, 11=14500, 12=15250, 13=16000, 14=16750,
  # 15=17500, 16=18000, 17=18500, 18=19000, 19=19500, 20=20000.
  health: 5000.0
  # Phase thresholds are represented by the canonical BossPhasePolicy ratios.
  attack-damage-bonus: 11.0
  target-rotation-seconds: [5, 8]
  recent-target-memory: 3
  target-lock-seconds: 6
  teleport-cooldown-seconds: 12
  spell-cooldown-seconds: [5, 8]
  spell-telegraph-ticks: 30
  phase-thresholds:
    hunt: 0.80
    last-seal: 0.20
  cinematic-telegraph-ticks: 80
  max-summoned-servants: 4
  arena-inferno:
    telegraph-ticks: 50
    duration-ticks: 100
    minimum-safe-ratio: 0.35
  # One bounded, once-per-boss LAST_SEAL strike. It never changes blocks.
  final-strike:
    enabled: true
    damage: 8.0
    radius: 4.0
    wither-ticks: 60
  # Permanent LAST_SEAL guardians use server-side Interaction hitboxes. Their
  # health is kept in a bounded slot ledger; the ItemDisplay is visual only.
  tentacle-guardians:
    enabled: true
    damage-window-ticks: 300
    respawn-delay-ticks: 800
    attack-interval-ticks: 220
    attack-stagger-ticks: 20
    hitbox-width: 1.35
    hitbox-height: 3.5
  # This optional boss visual is restricted to the current RIFT band. Vanilla
  # fireball assets are never replaced globally.
  rift-obelisks:
    enabled: true
    stages: [WAVE_4]
    cooldown-seconds: [18, 24]
    health: 3
    max-active: 6
    pulse-radius: 5.0
    pulse-interval-ticks: 40
    fire-interval-ticks: 80
    max-active-fireballs: 8
    fireball-damage: 6.0
    blindness-ticks: 40
    debuff-ticks: 60
    spawn-telegraph-ticks: 20
    destruction-delay-ticks: 8
    min-distance: 4.0

rewards:
  boss-xp: 3000
  max-xp-orbs: 20
  shard-item-id: rift_core_shard
  shard-channel-seconds: 3
  shard-cooldown-seconds: 600
  abyss-anchor-cooldown-seconds: 1800
  night-cloak-chance: 0.30
  return-stone-item-id: return_stone
  resource-bundle:
    ENDER_PEARL: 16
    CHORUS_FRUIT: 16

portal-room:
  world: CopiMine_the_end
  x: 0.5
  y: 80.0
  z: 0.5
  yaw: 0.0
  pitch: 0.0

client:
  boss-id: END_RIFT_GUARDIAN
  bridge-channel: copimine:client_bridge
