name: CopiMineEndEvent
version: '0.1.0'
main: me.copimine.endevent.CopiMineEndEvent
api-version: '1.21'
author: CopiMine
load: POSTWORLD
depend:
  - CopiMineWorldCore
  - CopiMineArtifacts
commands:
  cmend:
    description: Управление End Rift Event
    usage: /cmend <status|debug|recovery|core|arena|gate|door|portalroom|resources|ritual|wave|boss|client|test|cleanup|reset|unlock>; /cmend core setat <x> <y> <z> <N>; /cmend gate|door setat <x1> <y1> <z1> <x2> <y2> <z2>; /cmend arena border <seconds>; /cmend gate|door pos1|pos2|open|close [ticks-per-layer]; /cmend gate|door restore confirm; /cmend gate|door delete confirm; /cmend debug packets|objectives|hazards|perf|ai; /cmend test run creative|visuals mobs|boss
permissions:
  copimine.endevent.admin:
    description: Управление End Rift Event
    default: op
  copimine.endevent.test:
    description: Локальные тестовые волны и boss End Rift Event
    default: op
