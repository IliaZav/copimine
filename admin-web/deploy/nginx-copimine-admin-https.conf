server {
    # The release exposes one public socket only: HTTPS on 443.
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;

    server_name __COPIMINE_SERVER_NAMES__;
    # Event videos are streamed and checked by the application; nginx must not
    # reject a valid upload solely because of its size.
    client_max_body_size 0;

    # Keep the Velopack feed root canonical for older clients that omit the
    # trailing slash when resolving releases.win.json.
    location = /downloads/launcher {
        return 308 /downloads/launcher/;
    }

    # Compatibility alias for older Launcher builds that requested release
    # metadata from the download directory.
    location = /downloads/launcher/latest.json {
        alias /opt/copimine/admin-web/frontend/assets/public-data/launcher/latest.json;
        default_type application/json;
        add_header Cache-Control "public, max-age=60" always;
    }

    ssl_certificate __COPIMINE_TLS_CERT_PATH__;
    ssl_certificate_key __COPIMINE_TLS_KEY_PATH__;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 300s;
    }
}
