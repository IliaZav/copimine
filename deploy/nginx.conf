server {
    listen 80;
    listen [::]:80;
    server_name copimine.ru www.copimine.ru;
    location ^~ /.well-known/acme-challenge/ { root /var/www/copimine-acme; }
    location / { return 301 https://copimine.ru$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.copimine.ru;
    ssl_certificate /etc/letsencrypt/live/copimine.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/copimine.ru/privkey.pem;
    return 301 https://copimine.ru$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name copimine.ru;
    ssl_certificate /etc/letsencrypt/live/copimine.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/copimine.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 128k;
    autoindex off;
    location ~ ^/(?:\.git|\.env|backend|private|local_state|docs|data/seed) { return 404; }
    # No static aliases to BlueMap work files, private snapshots, game or secrets.
    # Application RBAC validates EVERY private asset. No proxy/cache exceptions.
    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 40s;
        proxy_connect_timeout 5s;
        proxy_buffering on;
        proxy_cache off;
    }
}
