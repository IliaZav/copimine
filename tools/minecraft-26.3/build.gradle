import groovy.json.JsonSlurper

plugins { id 'java' }

def profile = new JsonSlurper().parse(file('profile.lock.json'))
def serverPluginLock = new JsonSlurper().parse(file('server-plugins.lock.json'))
def checkout = file('../..').canonicalFile
def voiceChatPlugin = serverPluginLock.modules.find { it.pluginName == 'voicechat' }
if (voiceChatPlugin == null || voiceChatPlugin.filename != 'voicechat-bukkit-2.6.24.jar') {
    throw new GradleException('Pinned Paper Voice Chat API candidate is missing from the server lock')
}
def voiceChatApiCandidate = new File(checkout, "build/minecraft-26.3/server-plugins/${voiceChatPlugin.filename}")
def verifyVoiceChatApi = tasks.register('verifyVoiceChatApi') {
    doLast {
        if (!voiceChatApiCandidate.isFile() || voiceChatApiCandidate.length() != voiceChatPlugin.size) {
            throw new GradleException('Pinned Paper Voice Chat API candidate is missing or has the wrong size')
        }
        def voiceChatApiSha512 = java.security.MessageDigest.getInstance('SHA-512')
                .digest(voiceChatApiCandidate.bytes).encodeHex().toString()
        if (voiceChatApiSha512 != voiceChatPlugin.sha512) {
            throw new GradleException('Pinned Paper Voice Chat API candidate differs from the server lock')
        }
    }
}
layout.buildDirectory = new File(checkout, 'build/minecraft-26.3/plugins')

def currentJavaVersion = System.getProperty('java.version')
if (currentJavaVersion != profile.buildJavaVersion) {
    throw new GradleException("Minecraft " + profile.minecraftVersion + " migration builds require Java " +
            profile.buildJavaVersion + "; found " + currentJavaVersion)
}
repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
    maven { url = 'https://repo.extendedclip.com/releases/' }
}

def modules = [
    economyCore: ['copimine-economy-core', 'CopiMineEconomyCore'],
    worldCore: ['copimine-world-core', 'CopiMineWorldCore'],
    admin: ['copimine-admin-plugin', 'CopiMineUltimateAdminPlus'],
    artifacts: ['copimine-artifacts', 'CopiMineArtifacts'],
    electionCore: ['copimine-election-core', 'CopiMineElectionCore'],
    narcotics: ['copimine-narcotics', 'CopiMineNarcotics'],
    endEvent: ['copimine-end-event', 'CopiMineEndEvent'],
    authEffects: ['minecraft/server/plugins/AuthEffects', 'AuthEffects']
]

def moduleRuntimeResources = [
    economyCore: ['plugin.yml'],
    worldCore: ['plugin.yml', 'config.yml'],
    admin: ['plugin.yml', 'config.yml', 'messages_ru.yml'],
    artifacts: ['plugin.yml', 'config.yml', 'items.yml'],
    electionCore: ['plugin.yml', 'config.yml'],
    narcotics: ['plugin.yml', 'config.yml'],
    endEvent: ['plugin.yml', 'config.yml'],
    authEffects: ['plugin.yml']
]

modules.each { name, module ->
    sourceSets.create(name) {
        java.srcDir(new File(checkout, module[0] + (name == 'authEffects' ? '/src/main/java' : '/src')))
        resources.srcDir(new File(checkout, module[0] + (name == 'authEffects' ? '/src/main/resources' : '')))
        resources.include(moduleRuntimeResources[name])
    }
    dependencies.add("${name}CompileOnly", "io.papermc.paper:paper-api:${profile.paper.api}")
    tasks.named(sourceSets[name].processResourcesTaskName) {
        filteringCharset = 'UTF-8'
        filesMatching('plugin.yml') {
            filter { line -> line.startsWith('api-version:') ? "api-version: '${profile.minecraftVersion}'" : line }
        }
        // The line filter emits the platform separator and checked-out YAML keeps its own line
        // endings, so without this a Windows build never matches the Linux CI artifact digest.
        doLast {
            fileTree(destinationDirectory.get().asFile)
                    .matching { include '**/*.yml', '**/*.yaml' }
                    .each { file ->
                        def text = file.getText('UTF-8')
                        def normalized = text.replace('\r\n', '\n').replace('\r', '\n')
                        if (normalized != text) {
                            file.setText(normalized, 'UTF-8')
                        }
                    }
        }
    }
    tasks.register("${name}Jar", Jar) {
        dependsOn(sourceSets[name].classesTaskName)
        from(sourceSets[name].output)
        archiveFileName = "${module[1]}-${profile.minecraftVersion}.jar"
        destinationDirectory = layout.buildDirectory.dir('jars')
        preserveFileTimestamps = false
        reproducibleFileOrder = true
        manifest.attributes('CopiMine-Minecraft-Target': profile.minecraftVersion,
                'CopiMine-Paper-API': profile.paper.api)
    }
}

sourceSets.narcotics.java.srcDir(new File(checkout, 'tools/minecraft-26.3/protocol/src/main/java'))

sourceSets.create('bridgeServerTest') {
    java.srcDir(file('server-bridge-tests/src/test/java'))
    compileClasspath += sourceSets.narcotics.output + sourceSets.endEvent.output
    runtimeClasspath += output + compileClasspath
}

configurations.bridgeServerTestCompileOnly.extendsFrom(
        configurations.narcoticsCompileOnly, configurations.endEventCompileOnly)
configurations.bridgeServerTestImplementation.extendsFrom(
        configurations.narcoticsImplementation, configurations.endEventImplementation)
configurations.bridgeServerTestRuntimeOnly.extendsFrom(
        configurations.narcoticsRuntimeOnly, configurations.endEventRuntimeOnly)

dependencies {
    bridgeServerTestImplementation platform('org.junit:junit-bom:5.11.4')
    bridgeServerTestImplementation 'org.junit.jupiter:junit-jupiter'
    bridgeServerTestRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencies {
    adminCompileOnly sourceSets.economyCore.output
    adminCompileOnly 'me.clip:placeholderapi:2.12.3'
    adminCompileOnly files(voiceChatApiCandidate)
    artifactsCompileOnly sourceSets.economyCore.output
    electionCoreCompileOnly sourceSets.economyCore.output
    endEventCompileOnly sourceSets.worldCore.output
    endEventCompileOnly sourceSets.artifacts.output
    endEventCompileOnly sourceSets.narcotics.output
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = profile.minimumJava
}

tasks.register('migrationPlugins') {
    group = 'build'
    description = 'Compile all eight first-party plugins against the pinned 26.3 API in isolated output directories.'
    dependsOn(modules.keySet().collect { "${it}Jar" })
}

tasks.named('compileBridgeServerTestJava') {
    dependsOn sourceSets.narcotics.classesTaskName, sourceSets.endEvent.classesTaskName
}

tasks.register('bridgeServerTest', Test) {
    group = 'verification'
    description = 'Run focused Paper-side bridge service and key-loader tests.'
    testClassesDirs = sourceSets.bridgeServerTest.output.classesDirs
    classpath = sourceSets.bridgeServerTest.runtimeClasspath
    maxParallelForks = 1
    maxHeapSize = '128m'
    useJUnitPlatform()
    dependsOn sourceSets.bridgeServerTest.classesTaskName
}

tasks.register('verifyMigrationPluginResources') {
    group = 'verification'
    description = 'Verify each first-party migration JAR contains its required runtime resources.'
    dependsOn(modules.keySet().collect { "${it}Jar" })
    doLast {
        moduleRuntimeResources.each { name, requiredResources ->
            def archive = tasks.named("${name}Jar", Jar).get().archiveFile.get().asFile
            if (!archive.isFile()) {
                throw new GradleException("Migration plugin JAR is missing: ${archive}")
            }
            def zip = new java.util.zip.ZipFile(archive)
            try {
                def missing = requiredResources.findAll { zip.getEntry(it) == null }
                if (!missing.isEmpty()) {
                    throw new GradleException(
                            "${archive.name} is missing required runtime resources: ${missing.join(', ')}")
                }
            } finally {
                zip.close()
            }
            logger.lifecycle("Verified ${archive.name} resources: ${requiredResources.join(', ')}")
        }
    }
}
tasks.named('compileAdminJava') { dependsOn(verifyVoiceChatApi) }

tasks.register('verifyPaperApi') {
    doLast {
        def artifact = configurations.endEventCompileClasspath.resolvedConfiguration.resolvedArtifacts.find {
            it.moduleVersion.id.group == 'io.papermc.paper' && it.name == 'paper-api'
        }
        if (artifact == null) throw new GradleException('Pinned Paper API was not resolved')
        if (artifact.file.length() != profile.paper.apiSize) throw new GradleException('Paper API size mismatch')
        def actual = java.security.MessageDigest.getInstance('SHA-256').digest(artifact.file.bytes).encodeHex().toString()
        if (actual != profile.paper.apiSha256) throw new GradleException('Paper API SHA-256 mismatch')
        logger.lifecycle("Verified Paper API ${profile.paper.api}: ${actual}")
    }
}
tasks.named('migrationPlugins') { dependsOn('verifyPaperApi', 'verifyMigrationPluginResources') }
