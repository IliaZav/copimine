name: CopiMine verification

on:
  push:
    branches: [main, 'codex/**', 'agent/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  static-and-contract:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install backend test dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --disable-pip-version-check -r admin-web/requirements.txt
      - name: Run dependency vulnerability gate
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --disable-pip-version-check -r requirements-security.txt
          python -m pip_audit -r admin-web/requirements.txt --strict
      - name: Run Python contract tests
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem tests -Filter 'test_*.py' -File | ForEach-Object {
            Write-Host "RUN Python contract: $($_.Name)"
            python $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "Python contract failed: $($_.Name)" }
            Write-Host "PASS Python contract: $($_.Name)"
          }
          Write-Host 'RUN security self-test'
          python admin-web/scripts/security_selftest.py
          if ($LASTEXITCODE -ne 0) { throw 'Backend security self-test failed.' }
          Write-Host 'PASS security self-test'
          Write-Host 'RUN backend security regression'
          python admin-web/scripts/backend_security_regression_test.py
          if ($LASTEXITCODE -ne 0) { throw 'Backend security regression test failed.' }
          Write-Host 'PASS backend security regression'
          Write-Host 'RUN backend smoke test'
          python admin-web/scripts/backend_smoketest.py
          if ($LASTEXITCODE -ne 0) { throw 'Backend smoke test failed.' }
          Write-Host 'PASS backend smoke test'
          Write-Host 'RUN backend compileall'
          python -m compileall -q admin-web/backend
          if ($LASTEXITCODE -ne 0) { throw 'Backend compileall failed.' }
          Write-Host 'PASS backend compileall'
      - name: Run PowerShell validators
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & .\tests\RunCopiMineValidators.ps1
          if ($LASTEXITCODE -ne 0) { throw 'CopiMine validators failed.' }
      - name: Verify clean release provenance
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git status --porcelain) -ne '') { throw 'CI checkout is not clean.' }
          $sha = (git rev-parse HEAD).Trim()
          Write-Host "Verifying source SHA $sha"
          if ($sha.Length -ne 40) { throw 'Unexpected source SHA length.' }

  java-plugins:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Maven
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '3.9.9'
          $archive = Join-Path $env:RUNNER_TEMP "apache-maven-$version-bin.zip"
          $root = Join-Path $env:RUNNER_TEMP "apache-maven-$version"
          Invoke-WebRequest -Uri "https://archive.apache.org/dist/maven/maven-3/$version/binaries/apache-maven-$version-bin.zip" -OutFile $archive
          if (Test-Path -LiteralPath $root) { Remove-Item -LiteralPath $root -Recurse -Force }
          Expand-Archive -LiteralPath $archive -DestinationPath $env:RUNNER_TEMP -Force
          $mavenBin = Join-Path $root 'bin'
          if (-not (Test-Path -LiteralPath (Join-Path $mavenBin 'mvn.cmd'))) { throw 'Maven installation is incomplete.' }
          $mavenBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Prepare pinned Paper API and compile dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $paperBase = 'https://repo.papermc.io/repository/maven-public/io/papermc/paper/paper-api/1.21.1-R0.1-SNAPSHOT'
          $paperBuild = '1.21.1-R0.1-20250328.161643-128'
          $paperJar = Join-Path $env:RUNNER_TEMP "paper-api-$paperBuild.jar"
          $paperPom = Join-Path $env:RUNNER_TEMP "paper-api-$paperBuild.pom"
          $paperSha1 = Join-Path $env:RUNNER_TEMP "paper-api-$paperBuild.jar.sha1"
          Invoke-WebRequest -Uri "$paperBase/paper-api-$paperBuild.jar" -OutFile $paperJar
          Invoke-WebRequest -Uri "$paperBase/paper-api-$paperBuild.pom" -OutFile $paperPom
          Invoke-WebRequest -Uri "$paperBase/paper-api-$paperBuild.jar.sha1" -OutFile $paperSha1
          $expectedSha1 = (Get-Content -Raw -LiteralPath $paperSha1).Trim().Split()[0].ToLowerInvariant()
          $actualSha1 = (Get-FileHash -Algorithm SHA1 -LiteralPath $paperJar).Hash.ToLowerInvariant()
          if ($expectedSha1 -ne $actualSha1) { throw "Paper API SHA1 mismatch. Expected=$expectedSha1 Actual=$actualSha1" }
          $dependencyPom = Join-Path $env:RUNNER_TEMP 'copimine-paper-compile-dependencies.pom'
          @'
          <project xmlns="http://maven.apache.org/POM/4.0.0" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 https://maven.apache.org/xsd/maven-4.0.0.xsd">
            <modelVersion>4.0.0</modelVersion>
            <groupId>copimine</groupId>
            <artifactId>paper-compile-dependencies</artifactId>
            <version>1.0.0</version>
            <repositories>
              <repository><id>papermc</id><url>https://repo.papermc.io/repository/maven-public/</url></repository>
            </repositories>
            <dependencies>
              <dependency><groupId>net.kyori</groupId><artifactId>adventure-api</artifactId><version>4.17.0</version></dependency>
              <dependency><groupId>net.kyori</groupId><artifactId>adventure-text-minimessage</artifactId><version>4.17.0</version></dependency>
              <dependency><groupId>net.kyori</groupId><artifactId>adventure-text-serializer-gson</artifactId><version>4.17.0</version></dependency>
              <dependency><groupId>net.kyori</groupId><artifactId>adventure-text-serializer-legacy</artifactId><version>4.17.0</version></dependency>
              <dependency><groupId>net.kyori</groupId><artifactId>adventure-text-serializer-plain</artifactId><version>4.17.0</version></dependency>
              <dependency><groupId>net.kyori</groupId><artifactId>adventure-text-logger-slf4j</artifactId><version>4.17.0</version></dependency>
              <dependency><groupId>net.md-5</groupId><artifactId>bungeecord-chat</artifactId><version>1.20-R0.2-deprecated+build.18</version></dependency>
              <dependency><groupId>org.joml</groupId><artifactId>joml</artifactId><version>1.10.5</version></dependency>
            </dependencies>
          </project>
          '@ | Set-Content -LiteralPath $dependencyPom -Encoding utf8
          mvn -q -B -f $dependencyPom dependency:go-offline
          if ($LASTEXITCODE -ne 0) { throw 'Unable to download Paper compile dependencies.' }
          "PAPER_API_JAR=$paperJar" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Compile first-party plugins
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($dir in @('copimine-economy-core','copimine-election-core','copimine-artifacts','copimine-narcotics','copimine-world-core','copimine-admin-plugin','minecraft/server/plugins/AuthEffects')) {
            & powershell -ExecutionPolicy Bypass -File (Join-Path $dir 'build-plugin.ps1')
            if ($LASTEXITCODE -ne 0) { throw "Build failed: $dir" }
          }
