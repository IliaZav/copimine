# CopiMine End Rift Event.  This file is intentionally local/staging-safe by
# default.  The event never changes a world or database outside the server on
# which this plugin is explicitly installed.
environment: local

persistence:
  file: event-state.yml
  backup-file: event-state.yml.bak
  schema-version: 1

resources:
  DIAMOND: 100
  ENDER_EYE: 64
  AMETHYST_SHARD: 128
  BLAZE_ROD: 64

ritual:
  countdown-seconds: 60
  intermission-seconds: 10
  min-players: 2
  max-players: 20
  pad-radii: [5.0, 6.0, 7.0, 8.0]
  pad-occupancy-radius: 1.35

arena:
  world: CopiMine
  radius: 20.0
  vertical-radius: 3.0
  boss-radius: 20.0
  containment-radius: 20.0

mobs:
  spider:
    health-bonus: 10.0
    attack-damage-bonus: 2.0
  skeleton:
    health-bonus: 4.0
    attack-damage-bonus: 1.0
    elite-health: 40.0
    elite-attack-damage-bonus: 2.0

mini-bosses:
  spell-cooldown-seconds: [8, 12]
  spell-telegraph-ticks: 20
  rift-step:
    damage: 5.0
  void-snare:
    damage: 4.0
  echo-pulse:
    damage: 5.0

music:
  volume: 0.85
  waves:
    sound: copimine:end_rift/waves
    loop-seconds: 95
  boss:
    sound: copimine:end_rift/boss
    loop-seconds: 123
  boss-half:
    sound: copimine:end_rift/boss_half
    loop-seconds: 26
  boss-final:
    sound: copimine:end_rift/boss_final
    loop-seconds: 39
  victory:
    sound: copimine:end_rift/victory
    loop-seconds: 0

waves:
  hard-cap: 48
  wave-1:
    type: awakening
    endermen: 5
    spiders: 8
    skeletons: 4
    elite-endermen: 0
    elite-skeletons: 0
  wave-2:
    type: hunt
    endermen: 7
    spiders: 6
    skeletons: 3
    elite-endermen: 0
    elite-skeletons: 0
  wave-3:
    type: portals
    endermen: 10
    spiders: 0
    skeletons: 3
    elite-endermen: 4
    elite-skeletons: 1
  wave-4:
    type: tower_defense
    endermen: 8
    spiders: 6
    skeletons: 4
    elite-endermen: 2
    elite-skeletons: 1
  wave-5:
    type: rift_storm
    endermen: 12
    spiders: 8
    skeletons: 4
    elite-endermen: 6
    elite-skeletons: 2
  final:
    endermen: 0
    spiders: 8
    skeletons: 2
    elite-endermen: 6
    elite-skeletons: 1

# Event-owned mobs use these bounded drops.  Recovery/cleanup removes entities
# directly and therefore never enters EntityDeathEvent or creates kill loot.
event-loot:
  wave-mob:
    ENDER_PEARL: 2
    AMETHYST_SHARD: 1
  elite:
    ENDER_PEARL: 4
    AMETHYST_SHARD: 2
    EXPERIENCE_BOTTLE: 2
  final-wave:
    ENDER_PEARL: 4
    BONE: 4
    AMETHYST_SHARD: 2
  test:
    ENDER_PEARL: 1

# Guaranteed event loot appears at the Core after each initial wave.  The
# marker is persisted before the Item entities are created, so a restart
# cannot duplicate a wave reward.
wave-rewards:
  wave-1:
    ENDER_PEARL: 12
    EXPERIENCE_BOTTLE: 12
    COOKED_BEEF: 24
    ARROW: 12
    IRON_INGOT: 8
  wave-2:
    ENDER_PEARL: 18
    EXPERIENCE_BOTTLE: 18
    GOLD_INGOT: 12
    GOLDEN_CARROT: 18
    GOLDEN_APPLE: 2
  wave-3:
    ENDER_PEARL: 18
    EXPERIENCE_BOTTLE: 24
    DIAMOND: 4
    AMETHYST_SHARD: 12
    ECHO_SHARD: 3
  wave-4:
    ENDER_PEARL: 24
    EXPERIENCE_BOTTLE: 32
    DIAMOND: 5
    GOLDEN_APPLE: 3
    ECHO_SHARD: 3
  wave-5:
    ENDER_PEARL: 36
    EXPERIENCE_BOTTLE: 48
    DIAMOND: 8
    GOLDEN_APPLE: 4
    ECHO_SHARD: 6
    AMETHYST_SHARD: 24

wave-reward-shared-rare:
  wave-1: 0.0
  wave-2: 0.0
  wave-3: 0.0
  wave-4: 0.35
  wave-5: 0.50

# One deterministic additive roll set per event-owned mob death.  The legacy
# event-loot values above remain as the local fallback if a profile is omitted.
event-loot-rolls:
  spider:
    ENDER_PEARL: {chance: 0.15, min: 1, max: 1}
    EXPERIENCE_BOTTLE: {chance: 0.08, min: 1, max: 1}
    AMETHYST_SHARD: {chance: 0.10, min: 1, max: 3}
  skeleton:
    ARROW: {chance: 0.18, min: 1, max: 3}
    BONE: {chance: 0.22, min: 1, max: 2}
    EXPERIENCE_BOTTLE: {chance: 0.08, min: 1, max: 2}
  common-enderman:
    DIAMOND: {chance: 0.03, min: 1, max: 1}
    GOLDEN_APPLE: {chance: 0.04, min: 1, max: 1}
    ECHO_SHARD: {chance: 0.02, min: 1, max: 1}
    EXPERIENCE_BOTTLE: {chance: 0.12, min: 1, max: 3}
    ENDER_EYE: {chance: 0.08, min: 1, max: 1}
  elite-enderman:
    DIAMOND: {chance: 0.12, min: 1, max: 2}
    GOLDEN_APPLE: {chance: 0.10, min: 1, max: 1}
    ECHO_SHARD: {chance: 0.08, min: 1, max: 1}
    NETHERITE_SCRAP: {chance: 0.02, min: 1, max: 1}
    EXPERIENCE_BOTTLE: {chance: 0.25, min: 2, max: 5}
  elite-skeleton:
    ARROW: {chance: 0.45, min: 2, max: 6}
    BONE: {chance: 0.40, min: 2, max: 4}
    DIAMOND: {chance: 0.12, min: 1, max: 2}
    ECHO_SHARD: {chance: 0.08, min: 1, max: 1}
  final-wave:
    ENDER_PEARL: {chance: 0.25, min: 1, max: 2}
    AMETHYST_SHARD: {chance: 0.15, min: 1, max: 3}
  test:
    ENDER_PEARL: {chance: 1.0, min: 1, max: 1}

boss:
  health: 2500.0
  # The configured increment is exactly +5 over the previous 3.0 default.
  # BossStatsPolicy applies this value to the vanilla base once per hit.
  attack-damage-bonus: 8.0
  target-rotation-seconds: [5, 8]
  recent-target-memory: 3
  teleport-cooldown-seconds: 12
  spell-cooldown-seconds: [5, 8]
  spell-telegraph-ticks: 30
  final-ritual-telegraph-ticks: 80
  half-health: 1250.0
  final-threshold: 250.0
  final-health: 400.0
  final-drain-fraction: 0.60
  final-drain-min-health: 1.0
  control-duration-seconds: 20
  control-cooldown-seconds: 24
  max-summoned-servants: 4
  debuff-amplifier: 3
  arena-inferno:
    telegraph-ticks: 50
    duration-ticks: 100
    minimum-safe-ratio: 0.35

rewards:
  boss-xp: 3000
  max-xp-orbs: 20
  shard-item-id: rift_core_shard
  shard-channel-seconds: 3
  shard-cooldown-seconds: 3600
  return-stone-item-id: return_stone
  resource-bundle:
    ENDER_PEARL: 16
    CHORUS_FRUIT: 16

portal-room:
  world: CopiMine_the_end
  x: 0.5
  y: 80.0
  z: 0.5
  yaw: 0.0
  pitch: 0.0

client:
  boss-id: END_RIFT_GUARDIAN_V1
  control-id: END_RIFT_CONTROL_REVERSAL_V1
  bridge-channel: copimine:client_bridge
