import groovy.json.JsonSlurper

plugins { id 'java' }

def profile = new JsonSlurper().parse(file('profile.lock.json'))
def serverPluginLock = new JsonSlurper().parse(file('server-plugins.lock.json'))
def checkout = file('../..').canonicalFile
def voiceChatPlugin = serverPluginLock.modules.find { it.pluginName == 'voicechat' }
if (voiceChatPlugin == null || voiceChatPlugin.filename != 'voicechat-bukkit-2.6.24.jar') {
    throw new GradleException('Pinned Paper Voice Chat API candidate is missing from the server lock')
}
def voiceChatApiCandidate = new File(checkout, "build/minecraft-26.3/server-plugins/${voiceChatPlugin.filename}")
def verifyVoiceChatApi = tasks.register('verifyVoiceChatApi') {
    doLast {
        if (!voiceChatApiCandidate.isFile() || voiceChatApiCandidate.length() != voiceChatPlugin.size) {
            throw new GradleException('Pinned Paper Voice Chat API candidate is missing or has the wrong size')
        }
        def voiceChatApiSha512 = java.security.MessageDigest.getInstance('SHA-512')
                .digest(voiceChatApiCandidate.bytes).encodeHex().toString()
        if (voiceChatApiSha512 != voiceChatPlugin.sha512) {
            throw new GradleException('Pinned Paper Voice Chat API candidate differs from the server lock')
        }
    }
}
layout.buildDirectory = new File(checkout, 'build/minecraft-26.3/plugins')

if (JavaVersion.current().majorVersion.toInteger() < profile.minimumJava) {
    throw new GradleException("Minecraft ${profile.minecraftVersion} requires Java ${profile.minimumJava} or later")
}

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
    maven { url = 'https://repo.extendedclip.com/releases/' }
}

def modules = [
    economyCore: ['copimine-economy-core', 'CopiMineEconomyCore'],
    worldCore: ['copimine-world-core', 'CopiMineWorldCore'],
    admin: ['copimine-admin-plugin', 'CopiMineUltimateAdminPlus'],
    artifacts: ['copimine-artifacts', 'CopiMineArtifacts'],
    electionCore: ['copimine-election-core', 'CopiMineElectionCore'],
    narcotics: ['copimine-narcotics', 'CopiMineNarcotics'],
    endEvent: ['copimine-end-event', 'CopiMineEndEvent'],
    authEffects: ['minecraft/server/plugins/AuthEffects', 'AuthEffects']
]

modules.each { name, module ->
    sourceSets.create(name) {
        java.srcDir(new File(checkout, module[0] + (name == 'authEffects' ? '/src/main/java' : '/src')))
        resources.srcDir(new File(checkout, module[0] + (name == 'authEffects' ? '/src/main/resources' : '')))
        resources.include('plugin.yml', 'config.yml')
    }
    if (name == 'endEvent') {
        sourceSets[name].java.srcDir(new File(checkout, 'tools/minecraft-26.3/protocol/src/main/java'))
    }
    dependencies.add("${name}CompileOnly", "io.papermc.paper:paper-api:${profile.paper.api}")
    tasks.named(sourceSets[name].processResourcesTaskName) {
        filteringCharset = 'UTF-8'
        filesMatching('plugin.yml') {
            filter { line -> line.startsWith('api-version:') ? "api-version: '${profile.minecraftVersion}'" : line }
        }
    }
    tasks.register("${name}Jar", Jar) {
        dependsOn(sourceSets[name].classesTaskName)
        from(sourceSets[name].output)
        archiveFileName = "${module[1]}-${profile.minecraftVersion}.jar"
        destinationDirectory = layout.buildDirectory.dir('jars')
        preserveFileTimestamps = false
        reproducibleFileOrder = true
        manifest.attributes('CopiMine-Minecraft-Target': profile.minecraftVersion,
                'CopiMine-Paper-API': profile.paper.api)
    }
}

dependencies {
    adminCompileOnly sourceSets.economyCore.output
    adminCompileOnly 'me.clip:placeholderapi:2.12.3'
    adminCompileOnly files(voiceChatApiCandidate)
    artifactsCompileOnly sourceSets.economyCore.output
    electionCoreCompileOnly sourceSets.economyCore.output
    endEventCompileOnly sourceSets.worldCore.output
    endEventCompileOnly sourceSets.artifacts.output
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = profile.minimumJava
}

tasks.register('migrationPlugins') {
    group = 'build'
    description = 'Compile all eight first-party plugins against the pinned 26.3 API in isolated output directories.'
    dependsOn(modules.keySet().collect { "${it}Jar" })
}
tasks.named('compileAdminJava') { dependsOn(verifyVoiceChatApi) }

tasks.register('verifyPaperApi') {
    doLast {
        def artifact = configurations.endEventCompileClasspath.resolvedConfiguration.resolvedArtifacts.find {
            it.moduleVersion.id.group == 'io.papermc.paper' && it.name == 'paper-api'
        }
        if (artifact == null) throw new GradleException('Pinned Paper API was not resolved')
        def actual = java.security.MessageDigest.getInstance('SHA-256').digest(artifact.file.bytes).encodeHex().toString()
        if (actual != profile.paper.apiSha256) throw new GradleException('Paper API SHA-256 mismatch')
        logger.lifecycle("Verified Paper API ${profile.paper.api}: ${actual}")
    }
}
tasks.named('migrationPlugins') { dependsOn('verifyPaperApi') }
