name: CopiMine verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  migration-postgres-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: copimine_migration_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: migration-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d copimine_migration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      COPIMINE_TEST_POSTGRES_DSN: postgresql://postgres:migration-test-only@127.0.0.1:5432/copimine_migration_test
      COPIMINE_TEST_POSTGRES_ALLOW_PRIVATE_NETWORK: "1"
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source SHA
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.16'
      - name: Run PostgreSQL migration contract against ephemeral service
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check 'pytest==9.1.1' 'psycopg[binary]==3.2.3'
          python -m pytest -q -rs \
            tests/test_minecraft_26_3_custom_plugin_database_contracts.py::test_candidate_duplicate_migration_preserves_and_archives_real_postgres_rows \
            tests/test_minecraft_26_3_custom_plugin_database_contracts.py::test_election_core_removes_legacy_candidate_uuid_key_before_canonical_inserts

  static-and-contract:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.16'
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21.0.12.1'
      - name: Install backend test dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --disable-pip-version-check -r admin-web/requirements.txt
      - name: Run dependency vulnerability gate
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --disable-pip-version-check -r requirements-security.txt
          python -m pip_audit -r admin-web/requirements.txt --strict
          if ($LASTEXITCODE -ne 0) { throw 'Dependency vulnerability gate failed.' }
          python -m pip_audit -r requirements-security.txt --strict
          if ($LASTEXITCODE -ne 0) { throw 'Migration acceptance signing dependency audit failed.' }
      - name: Prepare release fixtures required by contract tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & powershell -NoProfile -ExecutionPolicy Bypass -File .\resourcepacks\build-resourcepack.ps1 -SkipServerProperties
          if ($LASTEXITCODE -ne 0) { throw 'Resource pack fixture build failed.' }
          & powershell -NoProfile -ExecutionPolicy Bypass -File .\tests\PrepareCopiMinePluginFixtures.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Pinned plugin fixture preparation failed.' }
          & powershell -NoProfile -ExecutionPolicy Bypass -File .\thirdparty\grim-creative-patch\build-grim-creative-patch.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Grim Creative fixture build failed.' }
      - name: Build client artifact required by contract tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & powershell -NoProfile -ExecutionPolicy Bypass -File .\CopiMineClient\build-client.ps1
          if ($LASTEXITCODE -ne 0) { throw 'CopiMineClient build failed.' }
          $clientJar = Join-Path $env:GITHUB_WORKSPACE 'CopiMineClient\build\libs\CopiMineClient-0.1.1.jar'
          if (-not (Test-Path -LiteralPath $clientJar -PathType Leaf)) { throw "CopiMineClient artifact was not created: $clientJar" }
      - name: Record Java 21 for the pinned Grim patch build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          "COPIMINE_JAVA_21_HOME=$env:JAVA_HOME" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Set up Java 25 for Minecraft 26.3 migration artifacts
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25.0.4.1'
      - name: Build and verify pinned Minecraft 26.3 candidates
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\minecraft\PrepareMigrationCandidates.ps1 `
            -BuildJavaHome $env:JAVA_HOME `
            -GrimPatchJavaHome $env:COPIMINE_JAVA_21_HOME `
            -PythonExe python
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Minecraft 26.3 candidate preparation failed.' }
      - name: Restore Java 21 for contract checks
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21.0.12.1'
      - name: Run Python contract tests
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pytest -q -rs tests --junitxml="$env:GITHUB_WORKSPACE\test-results.xml"
          if ($LASTEXITCODE -ne 0) { throw 'pytest contract suite failed.' }
          python admin-web/scripts/security_selftest.py
          if ($LASTEXITCODE -ne 0) { throw 'security self-test failed.' }
          python admin-web/scripts/backend_security_regression_test.py
          if ($LASTEXITCODE -ne 0) { throw 'backend security regression failed.' }
          python admin-web/scripts/backend_smoketest.py
          if ($LASTEXITCODE -ne 0) { throw 'backend smoke test failed.' }
          python -m compileall -q admin-web/backend
          if ($LASTEXITCODE -ne 0) { throw 'backend compileall failed.' }
      - name: Report Python contract failures
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $report = Join-Path $env:GITHUB_WORKSPACE 'test-results.xml'
          if (-not (Test-Path -LiteralPath $report -PathType Leaf)) { exit 0 }
          [xml]$xml = Get-Content -LiteralPath $report -Raw
          $failed = @($xml.SelectNodes('//testcase[failure or error]'))
          foreach ($case in $failed) {
            $name = "$($case.classname)::$($case.name)"
            $details = @($case.failure, $case.error) |
              Where-Object { $_ -ne $null } |
              ForEach-Object { $_.InnerText } |
              Select-Object -First 1
            $message = ($details -replace "`r?`n", ' ' -replace '\s+', ' ').Trim()
            Write-Output "::error title=Python contract failure::$name $message"
          }
      - name: Publish Python test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-test-results
          path: test-results.xml
          if-no-files-found: error
      - name: Verify exact CI checkout
        shell: pwsh
        env:
          MIGRATION_CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $status = @(git status --porcelain)
          if ($LASTEXITCODE -ne 0) { throw 'GitHub source checkout status could not be verified.' }
          # The contract job intentionally creates these two deterministic
          # release fixtures before pytest: the JAR is tracked for release
          # distribution and test-results.xml is uploaded as a CI artifact.
          # Any other source mutation still fails the provenance gate.
          $unexpected = @($status | Where-Object {
            $_ -notmatch '^ M thirdparty/grim-creative-patch/build/GrimAC-2\.3\.74-40684fb-creative-fix\.jar$' -and
            $_ -notmatch '^\?\? test-results\.xml$'
          })
          if ($unexpected.Count -ne 0) {
            $unexpected | ForEach-Object { Write-Output "::error title=CI checkout is dirty::$_" }
            throw 'CI checkout is not clean.'
          }
          $sha = (git rev-parse HEAD).Trim()
          Write-Host "Verifying source SHA $sha"
          if ($sha -notmatch '^[0-9a-f]{40}$' -or $sha -ne $env:MIGRATION_CI_HEAD_SHA) {
            throw "Checkout does not match the exact GitHub CI source SHA: $sha"
          }

      - name: Require evidence when migration locks claim acceptance
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python .\scripts\minecraft\validate_native_acceptance.py --root $env:GITHUB_WORKSPACE --require-evidence-for-accepted-locks
          if ($LASTEXITCODE -ne 0) { throw 'Migration locks claim acceptance without signed native Minecraft evidence.' }
      - name: Verify migration acceptance source provenance
        if: >-
          hashFiles('artifacts/minecraft-26.3/native-acceptance/**') != ''
        shell: pwsh
        env:
          MIGRATION_CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $sha = (git rev-parse HEAD).Trim()
          $parentRecord = ((git rev-list --parents -n 1 $sha).Trim() -split '\s+')
          if ($LASTEXITCODE -ne 0 -or $parentRecord.Count -ne 2) {
            throw 'Native acceptance evidence must be committed directly after its tested source commit.'
          }
          $migrationSourceCommit = $parentRecord[1]
          if ($migrationSourceCommit -notmatch '^[0-9a-f]{40}$') { throw 'Evidence parent is not a full Git SHA.' }
          git diff --quiet $migrationSourceCommit $sha -- . ':(exclude)artifacts/minecraft-26.3/native-acceptance/**'
          if ($LASTEXITCODE -ne 0) {
            throw 'The commit after the tested source may change only signed native-acceptance evidence.'
          }
          "MIGRATION_SOURCE_COMMIT=$migrationSourceCommit" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Require native Minecraft 26.3 acceptance evidence
        if: >-
          hashFiles('artifacts/minecraft-26.3/native-acceptance/**') != ''
        shell: pwsh
        env:
          MIGRATION_ACCEPTANCE_PUBLIC_KEY: ${{ vars.MIGRATION_ACCEPTANCE_PUBLIC_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          $verifiedAcceptanceArchive = Join-Path $env:GITHUB_WORKSPACE 'ci-verified-native-acceptance.zip'
          if (Test-Path -LiteralPath $verifiedAcceptanceArchive) { throw 'Reserved verified acceptance archive path must be absent before validation.' }
          python .\scripts\minecraft\validate_native_acceptance.py --root $env:GITHUB_WORKSPACE --expected-source-commit $env:MIGRATION_SOURCE_COMMIT --verified-output $verifiedAcceptanceArchive
          if ($LASTEXITCODE -ne 0) { throw 'Signed native Minecraft acceptance evidence is absent or does not match the trusted key, built candidates, and locked profile.' }
      - name: Upload CI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-26-3-ci-diagnostics
          path: |
            test-results.xml
            artifacts/end-rift-diagnostics/
          if-no-files-found: ignore
      - name: Upload verified Minecraft 26.3 acceptance evidence
        if: >-
          success() &&
          hashFiles('artifacts/minecraft-26.3/native-acceptance/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-26-3-native-acceptance
          path: ci-verified-native-acceptance.zip
          if-no-files-found: error

  java-plugins:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify exact CI checkout
        shell: pwsh
        env:
          CI_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $sha = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $sha -ne $env:CI_SOURCE_SHA) {
            throw "Java plugin job checked out $sha instead of the exact source SHA $env:CI_SOURCE_SHA"
          }
      - name: Set up Python for release assets
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.16'
      - name: Install release-asset build dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --disable-pip-version-check 'Pillow==12.3.0' 'pytest==9.1.1'
          if ($LASTEXITCODE -ne 0) { throw 'Release-asset Python dependencies failed to install.' }
      - name: Set up pinned Java 21 for plugin releases
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21.0.12.1'
      - name: Run shared Java plugin release gate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\minecraft\RunJavaPluginCi.ps1 `
            -JavaHome $env:JAVA_HOME `
            -WorkspaceRoot $env:GITHUB_WORKSPACE `
            -TemporaryDirectory $env:RUNNER_TEMP `
            -PythonExe python
          if ($LASTEXITCODE -ne 0) { throw 'Shared Java plugin release gate failed.' }
      - name: Upload End Rift gate diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: end-rift-event-gate-diagnostics
          path: |
            artifacts/end-rift-diagnostics/java-plugin-ci/**
            artifacts/end-rift-diagnostics/**
            minecraft/server/plugins/CopiMineEndEvent/diagnostics/**
          if-no-files-found: ignore
