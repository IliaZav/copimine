buildscript {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        mavenCentral()
    }
    dependencies {
        classpath "net.fabricmc:fabric-loom:${project.loom_version}"
    }
}

apply plugin: 'fabric-loom'
apply plugin: 'maven-publish'

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    testImplementation platform("org.junit:junit-bom:5.11.4")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

def kaguneImporterScript = file("tools/import_kagune_model.py")
def suppliedKaguneModel = file("src/main/asset-source/end-rift-tentacle/kagune.bbmodel")
tasks.register("importKaguneModel", Exec) {
    group = "build setup"
    description = "Imports the supplied Kagune mesh, UVs, clips, and original texture."
    inputs.files(suppliedKaguneModel, kaguneImporterScript)
    outputs.files(
            file("src/main/resources/assets/copimineclient/geometry/end_rift_tentacle.json"),
            file("src/main/resources/assets/copimineclient/textures/entity/end_rift_tentacle_hd.png"),
            file("../resourcepacks/src/assets/copimine/textures/item/end_event_rift_tentacle_hd.png"),
            file("../resourcepacks/src/assets/copimine/models/item/end_event_rift_tentacle.json"))
    commandLine(System.getenv("PYTHON") ?: "python", kaguneImporterScript.absolutePath)
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
    // Git checkouts may expose ordinary text resources with different line
    // endings. The supplied Chameleon guardian JSON, however, is an exact
    // authored asset: rewriting its line endings changes the animation and
    // geometry bytes embedded in the client JAR. Leave that source package
    // byte-for-byte untouched and normalize only unrelated JSON resources.
    doLast {
        fileTree(destinationDir).matching {
            include "**/*.json"
            exclude "assets/copimineclient/models/entity/end_rift_guardian/**"
        }.files.each { resource ->
            def normalized = resource.getText("UTF-8")
                    .replace("\r\n", "\n")
                    .replace("\r", "\n")
            resource.setText(normalized, "UTF-8")
        }
    }
}

def shaderpackRoot = file("src/main/resources/assets/copimineclient/shaderpacks")

tasks.register("validateShaderpacks") {
    group = "verification"
    description = "Validates bundled CopiMine shaderpack ZIP resources."
    doLast {
        if (!shaderpackRoot.exists()) {
            throw new GradleException("Shaderpack directory not found: ${shaderpackRoot}")
        }
        def zipFiles = shaderpackRoot.listFiles()?.findAll { it.isFile() && it.name.toLowerCase(Locale.ROOT).endsWith(".zip") }?.sort { a, b -> a.name <=> b.name } ?: []
        if (zipFiles.isEmpty()) {
            throw new GradleException("No shaderpack ZIP files found in ${shaderpackRoot}")
        }
        zipFiles.each { zipFile ->
            def hasEntries = false
            def hasRootShaders = false
            def hasWrappedRootShaders = false
            def hasVanillaOverrides = false
            new java.util.zip.ZipFile(zipFile).withCloseable { archive ->
                archive.entries().each { entry ->
                    if (!entry.directory) {
                        hasEntries = true
                        def normalized = entry.name.replace('\\', '/')
                        if (normalized.startsWith("shaders/")) {
                            hasRootShaders = true
                        }
                        if (!hasRootShaders && normalized ==~ /^[^\/]+\/shaders\/.*/) {
                            hasWrappedRootShaders = true
                        }
                        if (normalized.startsWith("assets/minecraft/shaders/")) {
                            hasVanillaOverrides = true
                        }
                    }
                }
            }
            if (!hasEntries) {
                throw new GradleException("Shaderpack ZIP is empty: ${zipFile.name}")
            }
            if (!hasRootShaders && !hasVanillaOverrides) {
                throw new GradleException("Shaderpack ZIP has no usable shader root: ${zipFile.name}")
            }
            def mode = hasRootShaders
                    ? (hasWrappedRootShaders ? "zip-shaderpack-compatible (wrapped root also detected)" : "zip-shaderpack-compatible")
                    : "fallback-only vanilla shader override"
            logger.lifecycle("validateShaderpacks: ${zipFile.name} -> ${mode}")
        }
    }
}

tasks.named("processResources") {
    dependsOn(tasks.named("validateShaderpacks"))
    dependsOn(tasks.named("importKaguneModel"))
}

tasks.named("check") {
    dependsOn(tasks.named("validateShaderpacks"))
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.named("sourcesJar") {
    dependsOn(tasks.named("importKaguneModel"))
}

// Keep the local visual verification client bounded so it can run alongside
// the isolated Paper/PostgreSQL harness on a developer workstation.
tasks.named("runClient").configure {
    jvmArgs "-Xms512m", "-Xmx3G", "-XX:MaxMetaspaceSize=512m"
}
