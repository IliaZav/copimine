server {
    # Internal relay: the public nginx TLS/HTTP vhost is the only listener
    # that should reach this port.  This prevents clients from spoofing
    # X-Forwarded-Proto over a public plaintext socket.
    listen 127.0.0.1:18080 default_server;
    listen [::1]:18080 default_server;

    server_name __COPIMINE_SERVER_NAMES__;
    # The panel currently has no upload endpoint. Keep anonymous request bodies
    # bounded; raise this only together with an authenticated upload feature.
    client_max_body_size 8m;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    location = /downloads/CopiMineMods.zip {
        proxy_pass http://127.0.0.1:8090/downloads/CopiMineMods.zip;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
        # Preserve the transport selected by the outer public proxy.  An
        # absent header deliberately remains absent, so direct local HTTP is
        # never upgraded to an authenticated transport by accident.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 300s;
    }

    location = /resourcepacks/CopiMineResourcePack.zip {
        proxy_pass http://127.0.0.1:8090/resourcepacks/CopiMineResourcePack.zip;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 300s;
    }
}
