name: CopiMine website verification

on:
  push:
    branches: ['codex/site-*', 'audit/chatgpt-site-*']
  pull_request:
    branches: ['codex/site-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Verify clean-checkout contracts
        run: python -m pytest -q -ra --junitxml=site-tests.xml tests
      - name: Check patch whitespace
        run: git diff --check
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check delivered JavaScript syntax
        run: find frontend/assets/js -maxdepth 1 -type f -name '*.js' -print0 | xargs -0 -r -n 1 node --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: website-test-results
          path: site-tests.xml
          if-no-files-found: ignore
          retention-days: 14
